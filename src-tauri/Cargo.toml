[package]
name = "ai-analyst-desktop"
version = "1.0.1"
description = "AI Analyst desktop shell"
authors = ["AI Analyst"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_analyst_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.2"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-shell = "2"
