services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_analyst
      MYSQL_USER: ai_analyst
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ai_analyst_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 2s
      retries: 30

  ai-analyst:
    build: .
    ports:
      - "8787:8787"
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - "--db-config"
      - "/run/secrets/db_config"
    secrets:
      - db_config
    volumes:
      # Persist settings + encrypted secrets.
      - ai_analyst_config:/home/nonroot/.config/aianalyst
      # Optional (BigQuery ADC): mount user ADC (gcloud application-default credentials).
      # - ${HOME}/.config/gcloud:/home/nonroot/.config/gcloud:ro
      # Optional: mount a service account JSON file.
      # - ./service-account.json:/creds/service-account.json:ro

volumes:
  ai_analyst_config:
  ai_analyst_mysql:

secrets:
  mysql_password:
    file: .local-db/mysql-password
  mysql_root_password:
    file: .local-db/mysql-root-password
  db_config:
    file: .local-db/db.json
