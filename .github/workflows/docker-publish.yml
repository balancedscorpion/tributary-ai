name: Publish Docker image (GHCR)

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Select publish target"
        required: true
        type: choice
        default: both
        options:
          - both
          - current_only
          - all_providers_only

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/${{ github.repository }}
            show_all_providers: "false"
            flavor: current_only
          - image: ghcr.io/${{ github.repository }}-all-providers
            show_all_providers: "true"
            flavor: all_providers_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Docker image repository names must be lowercase.
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        if: |
          ${{ github.event.inputs.publish_target == 'both' ||
          github.event.inputs.publish_target == matrix.flavor }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SHOW_ALL_PROVIDERS=${{ matrix.show_all_providers }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
